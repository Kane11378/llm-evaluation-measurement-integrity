name: export-final-public-snapshot

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/export-final-public-snapshot.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Stage snapshot
        run: |
          mkdir export
          rsync -a --exclude='.git' --exclude='.github/workflows/export-final-public-snapshot.yml' ./ export/
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: final-public-reproducibility-snapshot
          path: export/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
