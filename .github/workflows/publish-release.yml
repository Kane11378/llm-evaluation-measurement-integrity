name: publish-versioned-release

on:
  push:
    branches: [ main ]
    paths:
      - ".release/v1.0.0-nmi-submission"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pre-release file checks
        run: |
          test -s README.md
          test -s CITATION.cff
          test -s .zenodo.json
          test -s LICENSE
          test -s figures/FINAL_FIGURE_SHA256_MANIFEST.json
          test -s empirical/fresh_n124_instance_effects.csv
          test -s RELEASE_NOTES.md
          python -m json.tool .zenodo.json >/dev/null
          python -m json.tool figures/FINAL_FIGURE_SHA256_MANIFEST.json >/dev/null

      - name: Refuse duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0-nmi-submission >/dev/null 2>&1; then
            echo "Release v1.0.0-nmi-submission already exists."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0-nmi-submission \
            --target "${GITHUB_SHA}" \
            --title "v1.0.0-nmi-submission" \
            --notes-file RELEASE_NOTES.md
