name: finalize-publication-facing-language

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/finalize-publication-facing-language.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply publication-facing language cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, csv

          # README
          p=Path("README.md")
          t=p.read_text(encoding="utf-8")
          t=t.replace("**OMI** is the short case label used in the manuscript for the audited contextual-provenance empirical study. Its empirical record contains:",
                      "The audited contextual-provenance empirical study contains:")
          t=t.replace("historical OMI bias","historical measurement bias in the empirical case")
          t=t.replace("Frozen empirical OMI results","Frozen empirical results")
          t=t.replace("OMI integrity hazards, ICCs or resource-demand distributions","empirical integrity hazards, ICCs or resource-demand distributions")
          p.write_text(t,encoding="utf-8")

          # Zenodo prose
          p=Path(".zenodo.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          obj["description"]="Deterministic code, frozen figure data, empirical derived artifacts, manifests and reproducibility documentation accompanying the manuscript “Evaluation infrastructure can distort behavioral effects in language-model experiments”. The package separates exact analytic results, deterministic synthetic sensitivity surfaces, validation simulations and frozen empirical results from an audited contextual-provenance case study."
          p.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")

          # Claim-boundary prose
          p=Path("protocol/claim_boundaries.md")
          t=p.read_text(encoding="utf-8").replace("the synthetic sensitivity parameters estimate historical OMI bias",
                                                  "the synthetic sensitivity parameters estimate historical measurement bias in the empirical case")
          p.write_text(t,encoding="utf-8")

          # Visible empirical-example prose in public CSVs; provenance paths remain untouched.
          for name in ["figure_data/fig3_empirical_ladder.csv","figure_data/table1_protocol.csv"]:
              p=Path(name)
              rows=list(csv.DictReader(p.open(encoding="utf-8")))
              fns=list(rows[0].keys())
              for r in rows:
                  for k,v in list(r.items()):
                      if isinstance(v,str):
                          v=v.replace("Prospective scorer repair after OMI-3057 audit","Prospective scorer repair after scorer audit")
                          v=v.replace("OMI-3057 prospective scorer repair","Prospective scorer repair after scorer audit")
                          r[k]=v
              with p.open("w",encoding="utf-8",newline="") as f:
                  w=csv.DictWriter(f,fieldnames=fns); w.writeheader(); w.writerows(rows)

          # Figure / synthetic-framework prose. Historical task IDs and provenance paths remain unchanged.
          for name in ["analysis/reproduce_figures.py","analysis/sensitivity_surface_framework.py"]:
              p=Path(name); t=p.read_text(encoding="utf-8")
              reps={
                  "Analytic/deterministic synthetic surfaces — not OMI empirical estimates":"Analytic/deterministic synthetic surfaces — not empirical estimates of the case study",
                  "not calibrated to OMI":"not calibrated to the empirical case",
                  "Measurement failures and prospective safeguards in OMI":"Measurement failures and prospective safeguards in the empirical case",
                  "Confirmatory and exploratory provenance contrasts in OMI":"Confirmatory and exploratory provenance contrasts",
                  "not calibrated to OMI token/resource demand":"not calibrated to the empirical resource-demand distribution",
                  "ICC=.40 is synthetic and not estimated from OMI":"ICC=.40 is synthetic and not estimated from the empirical study",
                  "No OMI per-call hazard is inferred or estimated":"No empirical per-call hazard is inferred or estimated",
                  "frozen OMI-3078 examples":"frozen predecessor examples",
                  "historical OMI bias":"historical measurement bias in the empirical case",
              }
              for a,b in reps.items(): t=t.replace(a,b)
              p.write_text(t,encoding="utf-8")

          # Frozen explanatory JSON prose; archival task/schema identifiers stay intact.
          for name in ["analysis/SENSITIVITY_SURFACE_RESULTS.json","figure_data/figure_data_package.json"]:
              p=Path(name)
              t=p.read_text(encoding="utf-8")
              reps={
                  "synthetic only; not calibrated to OMI token/resource demand":"synthetic only; not calibrated to the empirical resource-demand distribution",
                  "K=6 is only a design-scale marker; ICC=.40 is synthetic and not estimated from OMI.":"K=6 is only a design-scale marker; ICC=.40 is synthetic and not estimated from the empirical study.",
                  "B=1488 is a scale marker only. No OMI per-call hazard is inferred or estimated.":"B=1488 is a scale marker only. No empirical per-call hazard is inferred or estimated.",
                  "frozen OMI-3078 examples":"frozen predecessor examples",
                  "historical OMI bias":"historical measurement bias in the empirical case",
              }
              for a,b in reps.items(): t=t.replace(a,b)
              p.write_text(t,encoding="utf-8")
          PY

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Regenerate deterministic outputs and publication figures
        run: |
          python analysis/sensitivity_surface_framework.py
          python analysis/validate_reproduction.py
          python analysis/recompute_n28.py
          python analysis/recompute_n124.py
          python analysis/reproduce_figures.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          files={}
          for p in sorted(Path("figures").glob("Figure*.*")):
              if p.suffix.lower() in {".svg",".pdf",".png"}:
                  b=p.read_bytes()
                  files[p.name]={"sha256":hashlib.sha256(b).hexdigest(),"bytes":len(b)}
          out={
              "schema":"PUBLIC_FIGURE_FREEZE_V1",
              "source_commit":None,
              "workflow_run_id":None,
              "files":files,
              "note":"Publication-facing figure freeze after removal of internal project branding; scientific content unchanged."
          }
          Path("figures/FINAL_FIGURE_SHA256_MANIFEST.json").write_text(json.dumps(out,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Commit final publication-facing release candidate
        run: |
          set -euo pipefail
          git config user.name "Kane"
          git config user.email "168049109+Kane11378@users.noreply.github.com"
          git add README.md .zenodo.json protocol/claim_boundaries.md             figure_data/fig3_empirical_ladder.csv figure_data/table1_protocol.csv             analysis/reproduce_figures.py analysis/sensitivity_surface_framework.py             analysis/SENSITIVITY_SURFACE_RESULTS.json figure_data/figure_data_package.json             reproduced/SENSITIVITY_SURFACE_RESULTS_REPRODUCED.json reproduced/figure_data             figures/Figure1.pdf figures/Figure1.png figures/Figure1.svg             figures/Figure2.pdf figures/Figure2.png figures/Figure2.svg             figures/Figure3.pdf figures/Figure3.png figures/Figure3.svg             figures/Figure4.pdf figures/Figure4.png figures/Figure4.svg             figures/FINAL_FIGURE_SHA256_MANIFEST.json
          git commit -m "Finalize publication-facing v1.0.0 release candidate"
          git push origin HEAD:main
