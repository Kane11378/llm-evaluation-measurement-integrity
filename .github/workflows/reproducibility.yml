name: reproducibility

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Recompute corrected N=28 confirmation
        run: python analysis/recompute_n28.py | tee n28_recompute.txt

      - name: Recompute fresh N=124 confirmation
        run: python analysis/recompute_n124.py | tee n124_recompute.txt

      - name: Recompute deterministic sensitivity surfaces
        run: python analysis/sensitivity_surface_framework.py

      - name: Validate regenerated surfaces against frozen data
        run: python analysis/validate_reproduction.py

      - name: Render figures from frozen public data
        run: |
          mkdir -p /tmp/frozen_figures reproduced_figures
          cp figures/Figure*.svg figures/Figure*.pdf figures/Figure*.png figures/FINAL_FIGURE_SHA256_MANIFEST.json /tmp/frozen_figures/
          python analysis/reproduce_figures.py
          cp figures/Figure*.svg figures/Figure*.pdf figures/Figure*.png reproduced_figures/

      - name: Restore and verify frozen publication figure identities
        run: |
          cp /tmp/frozen_figures/Figure*.svg /tmp/frozen_figures/Figure*.pdf /tmp/frozen_figures/Figure*.png figures/
          cp /tmp/frozen_figures/FINAL_FIGURE_SHA256_MANIFEST.json figures/
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path("figures/FINAL_FIGURE_SHA256_MANIFEST.json").read_text())
          for name,meta in manifest["files"].items():
              got=hashlib.sha256((Path("figures")/name).read_bytes()).hexdigest()
              if got != meta["sha256"]:
                  raise SystemExit(f"figure hash mismatch for {name}: {got} != {meta['sha256']}")
              print(name,got)
          PY

      - name: Upload reproducibility receipts
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-receipts
          path: |
            reproduced_figures/
            figures/FINAL_FIGURE_SHA256_MANIFEST.json
            n28_recompute.txt
            n124_recompute.txt
            reproduced/SENSITIVITY_SURFACE_RESULTS_REPRODUCED.json
          if-no-files-found: error
