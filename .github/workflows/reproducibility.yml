name: reproducibility

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Recompute fresh N=124 confirmation
        run: python analysis/recompute_n124.py | tee n124_recompute.txt

      - name: Recompute deterministic sensitivity surfaces
        run: python analysis/sensitivity_surface_framework.py

      - name: Validate regenerated surfaces against frozen data
        run: python analysis/validate_reproduction.py

      - name: Render figures from frozen public data
        run: python analysis/reproduce_figures.py

      - name: Verify expected figure formats
        run: |
          for n in 1 2 3 4; do
            test -s "figures/Figure${n}.svg"
            test -s "figures/Figure${n}.pdf"
            test -s "figures/Figure${n}.png"
          done

      - name: Build final figure hash manifest
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path("figures")
          files={}
          for p in sorted(root.glob("Figure*.*")):
              if p.suffix.lower() not in {".svg",".pdf",".png"}:
                  continue
              b=p.read_bytes()
              files[p.name]={"sha256":hashlib.sha256(b).hexdigest(),"bytes":len(b)}
          out={
              "schema":"OMI_PUBLIC_FIGURE_FREEZE_V1",
              "source_commit":os.environ["GITHUB_SHA"],
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "files":files
          }
          (root/"FINAL_FIGURE_SHA256_MANIFEST.json").write_text(
              json.dumps(out,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,indent=2))
          PY

      - name: Upload rendered figures and reproducibility receipts
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-rendered-figures
          path: |
            figures/Figure*.svg
            figures/Figure*.pdf
            figures/Figure*.png
            figures/FINAL_FIGURE_SHA256_MANIFEST.json
            n124_recompute.txt
            reproduced/SENSITIVITY_SURFACE_RESULTS_REPRODUCED.json
          if-no-files-found: error

      - name: Freeze validated publication figures in repository
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/Figure*.svg figures/Figure*.pdf figures/Figure*.png figures/FINAL_FIGURE_SHA256_MANIFEST.json
          if git diff --cached --quiet; then
            echo "No figure changes to freeze."
          else
            git commit -m "Freeze validated publication figures [skip ci]"
            git push
          fi
