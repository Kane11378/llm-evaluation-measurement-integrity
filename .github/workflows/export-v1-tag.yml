name: export-v1.0.0-tag

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/export-v1-tag.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: v1.0.0
          fetch-depth: 1
      - name: Stage exact tag snapshot
        run: |
          mkdir export
          rsync -a --exclude='.git' ./ export/
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: v1.0.0-exact-tag-snapshot
          path: export/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
