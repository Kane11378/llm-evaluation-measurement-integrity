<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900"><rect width="100%" height="100%" fill="white"/><text x="30" y="35" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#111"><tspan x="30" dy="0">Figure 3 | OMI empirical failure–repair ladder</tspan></text><text x="1270" y="35" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="end" fill="#111"><tspan x="1270" dy="0">Prospective safeguards; historical artifacts preserved</tspan></text><text x="38" y="75" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#111"><tspan x="38" dy="0">Observed failure</tspan></text><text x="253" y="75" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#111"><tspan x="253" dy="0">Scientific threat</tspan></text><text x="563" y="75" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#111"><tspan x="563" dy="0">Prospective safeguard</tspan></text><text x="933" y="75" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#111"><tspan x="933" dy="0">Frozen empirical anchor / preservation</tspan></text><rect x="25" y="92" width="1250" height="105" fill="#f3f3f3" stroke="#ccc"/><text x="38" y="115" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#111"><tspan x="38" dy="0">1. Parent-value leakage</tspan></text><text x="253" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="253" dy="0">Designated context not computationally</tspan><tspan x="253" dy="14">necessary</tspan></text><text x="563" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="563" dy="0">Remove parent value from current</tspan><tspan x="563" dy="14">prompt; verify prompt-alone closure</tspan></text><text x="933" y="115" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="933" dy="0">Earlier R2/MCAL S/T prompts reprinted</tspan><tspan x="933" dy="14">parent values; historical result preserved</tspan><tspan x="933" dy="14">= yes</tspan></text><rect x="25" y="202" width="1250" height="105" fill="#fafafa" stroke="#ccc"/><text x="38" y="225" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#111"><tspan x="38" dy="0">2. Scorer censoring</tspan></text><text x="253" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="253" dy="0">Completed/readable model errors could</tspan><tspan x="253" dy="14">leave denominator</tspan></text><text x="563" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="563" dy="0">Exact deterministic scorer; retain all</tspan><tspan x="563" dy="14">completed/readable nonexact outputs as</tspan><tspan x="563" dy="14">errors</tspan></text><text x="933" y="225" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="933" dy="0">Prospective scorer repair after OMI-3057</tspan><tspan x="933" dy="14">audit; historical result preserved = yes</tspan></text><rect x="25" y="312" width="1250" height="105" fill="#f3f3f3" stroke="#ccc"/><text x="38" y="335" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#111"><tspan x="38" dy="0">3. Stochastic finalizer</tspan></text><text x="253" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="253" dy="0">Second model call could change worker</tspan><tspan x="253" dy="14">measurement</tspan></text><text x="563" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="563" dy="0">Remove unnecessary stochastic</tspan><tspan x="563" dy="14">finalizer</tspan></text><text x="933" y="335" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="933" dy="0">Finalizer removed prospectively;</tspan><tspan x="933" dy="14">historical result preserved = yes</tspan></text><rect x="25" y="422" width="1250" height="105" fill="#fafafa" stroke="#ccc"/><text x="38" y="445" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#111"><tspan x="38" dy="0">4. False all-zero</tspan><tspan x="38" dy="14">derived ledger</tspan></text><text x="253" y="445" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="253" dy="0">Extraction erased completed raw</tspan><tspan x="253" dy="14">behavior</tspan></text><text x="563" y="445" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="563" dy="0">Persist raw custody; reconstruct</tspan><tspan x="563" dy="14">deterministically with frozen</tspan><tspan x="563" dy="14">oracle/scorer/analyzer</tspan></text><text x="933" y="445" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="933" dy="0">336 raw responses preserved; corrected</tspan><tspan x="933" dy="14">138/168 LOCAL vs 131/168 CROSS; p=.29398;</tspan><tspan x="933" dy="14">historical result preserved = yes</tspan></text><rect x="25" y="532" width="1250" height="105" fill="#f3f3f3" stroke="#ccc"/><text x="38" y="555" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#111"><tspan x="38" dy="0">5. 2048 resource</tspan><tspan x="38" dy="14">truncation</tspan></text><text x="253" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="253" dy="0">Planned response absent because output</tspan><tspan x="253" dy="14">cap exhausted</tspan></text><text x="563" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="563" dy="0">Classify integrity failure and stop;</tspan><tspan x="563" dy="14">no replay/resume of exposed bank</tspan></text><text x="933" y="555" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="933" dy="0">Ordinal 335 incomplete max_output_tokens;</tspan><tspan x="933" dy="14">no confirmatory prefix; historical result</tspan><tspan x="933" dy="14">preserved = yes</tspan></text><rect x="25" y="642" width="1250" height="105" fill="#fafafa" stroke="#ccc"/><text x="38" y="665" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#111"><tspan x="38" dy="0">6. 8192 prospective</tspan><tspan x="38" dy="14">requalification</tspan></text><text x="253" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="253" dy="0">Resource change after exposure could</tspan><tspan x="253" dy="14">become outcome-driven tuning</tspan></text><text x="563" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="563" dy="0">Fresh LOCAL-only non-confirmatory</tspan><tspan x="563" dy="14">qualification before new bank</tspan></text><text x="933" y="665" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="933" dy="0">32/32 complete/readable; zero integrity</tspan><tspan x="933" dy="14">failures; historical result preserved =</tspan><tspan x="933" dy="14">yes</tspan></text><rect x="25" y="752" width="1250" height="105" fill="#f3f3f3" stroke="#ccc"/><text x="38" y="775" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#111"><tspan x="38" dy="0">7. Fresh fixed-bank</tspan><tspan x="38" dy="14">confirmation</tspan></text><text x="253" y="775" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="253" dy="0">Outcome-informed exploratory signal</tspan><tspan x="253" dy="14">could be mistaken for confirmation</tspan></text><text x="563" y="775" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="563" dy="0">Wholly fresh N=124 bank; frozen</tspan><tspan x="563" dy="14">L=(D_U-D_S)/2; no retry/replacement</tspan></text><text x="933" y="775" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="933" dy="0">1,488/1,488 complete; depth primary</tspan><tspan x="933" dy="14">+0.016129, p=.5368; escalation stopped;</tspan><tspan x="933" dy="14">historical result preserved = yes</tspan></text><text x="30" y="875" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#111"><tspan x="30" dy="0">The ladder is measurement hardening, not accumulation of positive behavioral evidence. Repairs were prospective; invalid/exploratory history was not rewritten.</tspan></text></svg>