<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="100%" height="100%" fill="white"/><style>.p{font-family:Arial,Helvetica,sans-serif;fill:#111}.box{fill:#fff;stroke:#111;stroke-width:1.6}.muted{fill:#f4f4f4;stroke:#555;stroke-width:1.2}.dash{stroke:#555;stroke-width:1.4;stroke-dasharray:6 5;fill:none}.solid{stroke:#111;stroke-width:1.8;fill:none}</style><text x="35" y="35" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#111"><tspan x="35" dy="0">Figure 1 | Identification and measurement pipeline</tspan></text><rect x="30" y="65" width="555" height="250" rx="8" class="box"/><text x="45" y="90" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#111"><tspan x="45" dy="0">a</tspan></text><text x="75" y="90" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#111"><tspan x="75" dy="0">Matched provenance intervention</tspan></text><rect x="615" y="65" width="555" height="250" rx="8" class="box"/><text x="630" y="90" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#111"><tspan x="630" dy="0">b</tspan></text><text x="660" y="90" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#111"><tspan x="660" dy="0">Computational necessity</tspan></text><rect x="30" y="345" width="790" height="375" rx="8" class="box"/><text x="45" y="370" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#111"><tspan x="45" dy="0">c</tspan></text><text x="75" y="370" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#111"><tspan x="75" dy="0">Measurement chain</tspan></text><rect x="850" y="345" width="320" height="375" rx="8" class="box"/><text x="865" y="370" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#111"><tspan x="865" dy="0">d</tspan></text><text x="895" y="370" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#111"><tspan x="895" dy="0">Identification ≠ detection</tspan></text><text x="55" y="108" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#111"><tspan x="55" dy="0">z = 0</tspan></text><rect x="130" y="85" width="170" height="45" rx="5" class="box"/><text x="215" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#111"><tspan x="215" dy="0">A: same alias/value —</tspan><tspan x="215" dy="13.2">role 0</tspan></text><rect x="320" y="85" width="170" height="45" rx="5" class="muted"/><text x="405" y="110" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#111"><tspan x="405" dy="0">B: same alias/value —</tspan><tspan x="405" dy="13.2">role 1</tspan></text><text x="55" y="193" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#111"><tspan x="55" dy="0">z = 1</tspan></text><rect x="130" y="170" width="170" height="45" rx="5" class="box"/><text x="215" y="195" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#111"><tspan x="215" dy="0">A: same alias/value —</tspan><tspan x="215" dy="13.2">role 1</tspan></text><rect x="320" y="170" width="170" height="45" rx="5" class="muted"/><text x="405" y="195" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#111"><tspan x="405" dy="0">B: same alias/value —</tspan><tspan x="405" dy="13.2">role 0</tspan></text><text x="55" y="285" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#111"><tspan x="55" dy="0">Fixed: prompt, semantic values, record count/order, role multiset, model/settings/resources.</tspan></text><text x="645" y="115" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#111"><tspan x="645" dy="0">World w</tspan></text><rect x="720" y="90" width="180" height="48" rx="5" class="muted"/><text x="810" y="111" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#111"><tspan x="810" dy="0">A = v</tspan></text><path d="M 905 115 L 975 115" class="solid"/><polygon points="975,115 965,110 965,120" fill="#111"/><rect x="985" y="90" width="165" height="48" rx="5" class="box"/><text x="1067" y="111" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#111"><tspan x="1067" dy="0">oracle = g</tspan></text><text x="645" y="200" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#111"><tspan x="645" dy="0">World w′</tspan></text><rect x="720" y="175" width="180" height="48" rx="5" class="muted"/><text x="810" y="196" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#111"><tspan x="810" dy="0">A = v′</tspan></text><path d="M 905 200 L 975 200" class="solid"/><polygon points="975,200 965,195 965,205" fill="#111"/><rect x="985" y="175" width="165" height="48" rx="5" class="box"/><text x="1067" y="196" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#111"><tspan x="1067" dy="0">oracle = g′</tspan></text><text x="645" y="285" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#111"><tspan x="645" dy="0">Same current prompt + nondesignated information; changing A changes the deterministic oracle target.</tspan><tspan x="645" dy="15">Task/oracle necessity does not establish an internal neural retrieval mechanism.</tspan></text><path d="M 75 420 L 185 390" class="solid"/><path d="M 75 420 L 185 455" class="solid"/><path d="M 185 390 L 315 420" class="solid"/><path d="M 185 455 L 315 420" class="solid"/><path d="M 315 420 L 435 420" class="solid"/><path d="M 435 420 L 555 420" class="solid"/><path d="M 435 420 L 475 605" class="dash"/><path d="M 555 420 L 665 420" class="solid"/><path d="M 665 420 L 765 420" class="solid"/><path d="M 765 420 L 655 525" class="solid"/><path d="M 655 525 L 770 525" class="solid"/><path d="M 315 420 L 330 605" class="dash"/><path d="M 330 605 L 765 420" class="solid"/><rect x="25" y="396" width="100" height="48" rx="6" class="box"/><text x="75" y="416" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#111"><tspan x="75" dy="0">Independent instance i</tspan></text><rect x="135" y="366" width="100" height="48" rx="6" class="box"/><text x="185" y="386" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#111"><tspan x="185" dy="0">Matched condition z=0</tspan></text><rect x="135" y="431" width="100" height="48" rx="6" class="box"/><text x="185" y="451" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#111"><tspan x="185" dy="0">Matched condition z=1</tspan></text><rect x="265" y="396" width="100" height="48" rx="6" class="box"/><text x="315" y="416" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#111"><tspan x="315" dy="0">Stochastic worker</tspan><tspan x="315" dy="12">response</tspan></text><rect x="385" y="396" width="100" height="48" rx="6" class="box"/><text x="435" y="416" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#111"><tspan x="435" dy="0">Completion /</tspan><tspan x="435" dy="12">readability</tspan></text><rect x="505" y="396" width="100" height="48" rx="6" class="box"/><text x="555" y="416" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#111"><tspan x="555" dy="0">Raw-response custody</tspan></text><rect x="615" y="396" width="100" height="48" rx="6" class="box"/><text x="665" y="416" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#111"><tspan x="665" dy="0">Deterministic</tspan><tspan x="665" dy="12">extraction</tspan></text><rect x="715" y="396" width="100" height="48" rx="6" class="box"/><text x="765" y="416" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#111"><tspan x="765" dy="0">Frozen deterministic</tspan><tspan x="765" dy="12">score</tspan></text><rect x="605" y="501" width="100" height="48" rx="6" class="box"/><text x="655" y="521" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#111"><tspan x="655" dy="0">Within-instance</tspan><tspan x="655" dy="12">aggregation</tspan></text><rect x="720" y="501" width="100" height="48" rx="6" class="box"/><text x="770" y="521" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#111"><tspan x="770" dy="0">Independent-instance</tspan><tspan x="770" dy="12">inference</tspan></text><rect x="280" y="581" width="100" height="58" rx="6" class="box"/><text x="330" y="601" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#111"><tspan x="330" dy="0">Behavioral error:</tspan><tspan x="330" dy="12">completed/readable</tspan><tspan x="330" dy="12">nonexact</tspan></text><rect x="425" y="581" width="100" height="58" rx="6" class="muted"/><text x="475" y="601" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#111"><tspan x="475" dy="0">Integrity failure:</tspan><tspan x="475" dy="12">planned observation</tspan><tspan x="475" dy="12">absent</tspan></text><text x="55" y="690" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#111"><tspan x="55" dy="0">Solid: intended measurement path. Dashed: classification/integrity branches. Raw custody precedes deterministic extraction and scoring.</tspan></text><rect x="885" y="410" width="250" height="100" rx="8" class="muted"/><text x="1010" y="440" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#111"><tspan x="1010" dy="0">Identification</tspan></text><text x="1010" y="465" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#111"><tspan x="1010" dy="0">What intervention is isolated</tspan><tspan x="1010" dy="15">under stated assumptions</tspan></text><rect x="885" y="545" width="250" height="100" rx="8" class="box"/><text x="1010" y="575" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#111"><tspan x="1010" dy="0">Detection</tspan></text><text x="1010" y="600" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#111"><tspan x="1010" dy="0">What observed data support</tspan><tspan x="1010" dy="15">statistically</tspan></text><text x="1010" y="690" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#111"><tspan x="1010" dy="0">An identified estimand can yield a non-detection.</tspan></text></svg>